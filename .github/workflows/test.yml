name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python dependencies
        run: pip install maturin pyarrow polars pandas pytest pytest-cov

      - name: Build ladle-io
        run: VIRTUAL_ENV=$pythonLocation maturin develop --manifest-path ladle-io/Cargo.toml

      - name: Build ladle-ops
        run: VIRTUAL_ENV=$pythonLocation maturin develop --manifest-path ladle-ops/Cargo.toml

      - name: Run tests
        run: pytest --tb=short
