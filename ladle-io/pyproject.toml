[project]
name = "ladle-io"
version = "0.0.1"
description = "I/O bindings to the noodles bioinformatics library (BAM, VCF, BCF, SAM)"
license = { text = "MIT" }
requires-python = ">=3.11"

[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "../python"
module-name = "ladle._ladle_io"
features = ["pyo3/abi3-py311"]
