[project]
name = "ladle-ops"
version = "0.0.1"
description = "Genomic interval operations for Arrow-compatible data (overlap, nearest)"
license = { text = "MIT" }
requires-python = ">=3.11"

[build-system]
requires = ["maturin>=1.13,<2.0"]
build-backend = "maturin"

[tool.maturin]
python-source = "../python"
module-name = "ladle._ladle_ops"
features = ["pyo3/abi3-py311"]
