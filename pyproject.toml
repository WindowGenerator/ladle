[project]
name = "ladle"
version = "0.1.0"
description = "Python bindings to the noodles bioinformatics library"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sergey Chudov", email = "chudov42@gmail.com" }]
requires-python = ">=3.11"

[project.optional-dependencies]
polars  = ["polars>=1.0"]
pandas  = ["pandas>=2.0", "pyarrow>=15.0"]
arrow   = ["pyarrow>=15.0"]
duckdb  = ["duckdb>=1.0"]
all     = ["ladle[polars,pandas,duckdb]"]
dev     = [
    "maturin>=1.13,<2.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "pyarrow>=15.0",
    "polars>=1.0",
]
docs    = [
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.25",
    "pymdown-extensions>=10.0",
]

# Build both crates:
#   VIRTUAL_ENV=.venv .venv/bin/maturin develop --manifest-path ladle-io/Cargo.toml
#   VIRTUAL_ENV=.venv .venv/bin/maturin develop --manifest-path ladle-ops/Cargo.toml

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"
